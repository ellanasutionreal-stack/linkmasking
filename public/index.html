<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Generator Link Masking</title>
<style>
  :root {
    --orange: #f0592a;
    --orange-dark: #d94a1f;
    --border: #e3e3e3;
    --text: #2b2b2b;
    --muted: #8a8a8a;
    --bg-success: #eef7ee;
    --success-border: #bfe3bf;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 24px 12px;
    color: var(--text);
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  h1 { font-size: 20px; margin: 0; }
  .btn-logout {
    background: #e53935;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .login-row { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .success-box {
    background: var(--bg-success);
    border: 1px solid var(--success-border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 20px;
    display: none;
  }
  .success-box.show { display: block; }
  .success-box p:first-child { font-weight: 600; margin: 0 0 8px; }
  .link-row {
    display: flex;
    gap: 6px;
  }
  .link-row input {
    flex: 1;
    font-size: 13px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fafffa;
  }
  .link-row button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    padding: 0 12px;
    cursor: pointer;
    font-size: 13px;
  }
